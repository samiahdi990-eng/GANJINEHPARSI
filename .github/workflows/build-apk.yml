name: Build Ganjineh Parsi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --project-name ganjineh_parsi temp_app

      - name: Copy app files
        run: |
          rm -rf temp_app/lib
          cp -r lib temp_app/lib
          cp pubspec.yaml temp_app/pubspec.yaml
          sed -i 's/android:label="ganjineh_parsi"/android:label="گنجینه پارسی"/' temp_app/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GANJINEH-PARSI-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
